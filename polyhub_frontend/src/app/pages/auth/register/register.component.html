<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-logo">⚖ PolyHub</span>
      <h2>Create Account</h2>
      <p>Register as a party admin</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }

      <div class="field-row">
        <div class="field">
          <label>First Name</label>
          <input
            type="text"
            [(ngModel)]="firstname"
            name="firstname"
            placeholder="John"
            required
          />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Last Name</label>
          <input
            type="text"
            [(ngModel)]="lastname"
            name="lastname"
            placeholder="Doe"
            required
          />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            required
          />  
        </div>
      </div>
      
      <div class="field-row">
        <div class="field">
          <label>Password</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required
          />
        </div>
      </div>
      
      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a routerLink="/auth/login">Sign in here</a>
    </div>
  </div>
</div>
